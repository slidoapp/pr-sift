[project]
name = "ai-reviewer"
version = "0.1.0"
description = "Review GitHub pull requests by what matters: architecture, interfaces, behavior."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
reviewer = "reviewer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reviewer"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
